        function renderHistory() {
            let historySection = document.getElementById('history-section');
            let list = document.getElementById('history-list');
            if (savedRaces.length === 0) {
                historySection.style.display = 'none';
                return;
            }
            historySection.style.display = 'block';
            list.innerHTML = '';
            savedRaces.forEach((race, idx) => {
                let li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <span class="history-item-title" onclick="loadRace(${idx})">${race.title}</span>
                    <span class="history-delete" onclick="deleteRace(${idx}, event)">✖</span>
                `;
                list.appendChild(li);
            });
        }

        function saveToHistory(title, rawText) {
            let existingIdx = savedRaces.findIndex(r => r.title === title);
            if (existingIdx > -1) {
                savedRaces[existingIdx].rawText = rawText; 
            } else {
                savedRaces.push({ title: title, rawText: rawText });
            }
            localStorage.setItem('keibaSateiMemory', JSON.stringify(savedRaces));
            renderHistory();
        }

        function loadRace(idx) {
            document.getElementById('input-text').value = savedRaces[idx].rawText;
            analyzeData(false); 
            window.scrollTo({ top: document.getElementById('result-area').offsetTop - 20, behavior: 'smooth' });
        }

        function deleteRace(idx, event) {
            event.stopPropagation();
            if(confirm(savedRaces[idx].title + ' を削除しますか？')) {
                savedRaces.splice(idx, 1);
                localStorage.setItem('keibaSateiMemory', JSON.stringify(savedRaces));
                renderHistory();
            }
        }
        
        function clearAllHistory() {
            if(confirm('保存された全てのレースを削除しますか？')) {
                savedRaces = [];
                localStorage.setItem('keibaSateiMemory', JSON.stringify(savedRaces));
                renderHistory();
                resetData();
            }
        }

        window.onload = function() {
            renderHistory();
        };

            document.getElementById('input-text').value = '';
            document.getElementById('result-area').innerHTML = '';
            document.getElementById('action-btns').style.display = 'none';

                        let sMatch = line.match(/父\s*[:：]?\s*([^\n（\(\/]+)/);
                        if (sMatch) rawSire = sMatch[1].trim();
                    }
                    if (line.includes("母")) {
                        let bMatch = line.match(/母[^\n（\(]*[（\(]([^）\)]+)[）\)]/);
                        if (bMatch) rawBms = bMatch[1].trim();
                        else {
                            let bMatch2 = line.match(/母父?\s*[:：]?\s*([^\n]+)/);
                            if(bMatch2) rawBms = bMatch2[1].trim();
                        }
                    }
                }

                // 【究極進化】騎手抽出：どこに飛んでいても全ての行を舐めて絶対に探す
                let rawJockey = "不明";
                for (let k = 0; k < lines.length; k++) {
                    let line = lines[k].trim();
                    
                    if (line.length === 0) continue;
                    if (line.includes(hName)) continue; // 馬名と同じ行はスキップ
                    
                    // 過去走データやタイム、血統などの不要な行を徹底的に排除
                    if (line.match(/\d{3}kg/) || line.match(/^計不/) || line.includes("着") || line.includes("3F") || line.match(/\d{4}\.\d{2}\.\d{2}/) || line.match(/\d+-\d+/) || line.includes("タイム")) continue;
                    if (line.includes("父") || line.includes("母") || line.includes("賞") || line.includes("ステークス") || line.includes("特別") || line.includes("オッズ")) continue;

                    // 記号や数字を消して、純粋な名前（アルファベット・漢字・ひらがな）だけにする
                    let cleanLine = line.replace(/[^一-龠ぁ-んァ-ヶA-Za-z]/g, '');
                    if (cleanLine.length < 2) continue;

                    for (let key in loadedJockeyDict) {
                        let cleanKey = key.replace(/[^一-龠ぁ-んァ-ヶA-Za-z]/g, '');
                        if (cleanLine.includes(cleanKey) && cleanKey.length >= 2) {
                            rawJockey = key;
                            break;
                        }
                    }
                    if (rawJockey !== "不明") break;
                }

                const defaultData = { val: [3, 3, 3, 3, 3], comment: "データ未査定" };

                let sName = "不明", sData = defaultData;
                for (let key in loadedSireDict) { if (rawSire.replace(/\s+/g,'').includes(key.replace(/\s+/g,''))) { sName=key; sData = loadedSireDict[key]; break; } }
                if(sName === "不明" && rawSire !== "不明") sName = rawSire;

                let bName = "不明", bData = defaultData;
                for (let key in loadedBmsDict) { if (rawBms.replace(/\s+/g,'').includes(key.replace(/\s+/g,''))) { bName=key; bData = loadedBmsDict[key]; break; } }
                if(bName === "不明" && rawBms !== "不明") bName = rawBms;
                
                let jData = defaultData;
                if (loadedJockeyDict[rawJockey]) {
                    jData = loadedJockeyDict[rawJockey];
                } else {
                    for (let key in loadedJockeyDict) {
                        if (rawJockey.includes(key.replace(/\s+/g, '')) || key.replace(/\s+/g, '').includes(rawJockey)) {
                            jData = loadedJockeyDict[key]; 
                            rawJockey = key; 
                            break;
                        }
                    }
                }

                let hParams = sData.val.map((v, idx) => Math.round((v * 0.6 + bData.val[idx] * 0.4) * 10) / 10);
                let jParams = jData.val;

                let hOddsNum = parseFloat(hOdds);
                let oddsHtml = `<span class="odds-info">${hOdds}倍 (${hPop}番人気)</span>`;
                if (!isNaN(hOddsNum) && hOddsNum <= 10.0) {
                    oddsHtml = `<span class="odds-hot">${hOdds}倍 (${hPop}番人気)</span>`;
                }

                generatedCopyText += `■${frameStr}枠${horseStr}番 ${hName} (${hOdds}倍 / ${hPop}番人気)\n`;
                generatedCopyText += `父: ${sName} / 母父: ${bName}\n`;
                generatedCopyText += `鞍上: ${rawJockey}\n`;
                generatedCopyText += `【馬】${sData.comment} 母父からは「${bData.comment}」\n`;
                generatedCopyText += `【騎手】${jData.comment}\n`;
                generatedCopyText += `[査定] 馬: ｽﾋﾟ${hParams[0].toFixed(1)}/ｽﾀ${hParams[1].toFixed(1)}/ﾊﾟﾜ${hParams[2].toFixed(1)}/瞬${hParams[3].toFixed(1)}/操${hParams[4].toFixed(1)}\n`;
                generatedCopyText += `[査定] 騎: 腕${jParams[0]}/ﾍﾟ${jParams[1]}/馬${jParams[2]}/位${jParams[3]}/仕${jParams[4]}\n\n`;

                html += `
                <div class="race-row" onclick="toggleAccordion(${i})">
                    <div class="frame-box ${fClass}">
                        <span>${frameStr}枠</span><span>${horseStr}番</span>
                    </div>
                    <div class="horse-content">
                        <div class="horse-main-line">
                            <div class="horse-name-area">
                                <span class="horse-name">${hName}</span>
                                ${oddsHtml}
                            </div>
                            <div style="display: flex; align-items: center;">
                                <span class="jockey-tag">${rawJockey}</span>
                                <span class="row-expand-icon" id="icon-${i}">▼</span>
                            </div>
                        </div>
                        <div class="pedigree-mini">父: ${sName} / 母父: ${bName}</div>
                    </div>
                </div>
                
                <div id="accordion-${i}" class="accordion-content">
                    <div class="charts-container">
                        <div class="chart-box">
                            <div class="chart-title">血統パラメータ (馬)</div>
                            <canvas id="horseChart-${i}"></canvas>
                        </div>
                        <div class="chart-box">
                            <div class="chart-title">騎手査定パラメータ</div>
                            <canvas id="jockeyChart-${i}"></canvas>
                        </div>
                    </div>

                    <div class="commentary-box">
                        <span class="tag blue">血統</span> ${sData.comment} 母父からは「${bData.comment}」<br><br>
                        <span class="tag">騎手</span> <strong>${rawJockey}</strong>：${jData.comment}
                    </div>
                </div>`;

                chartDataList.push({ index: i, horseParams: hParams, jockeyParams: jParams });
            }

            html += '</div>';
            resultArea.innerHTML = html;
            document.getElementById('action-btns').style.display = 'flex';

            chartDataList.forEach(data => {
                drawRadarChart(`horseChart-${data.index}`, '馬の能力', ['スピード', 'スタミナ', 'パワー', '瞬発力', '操縦性'], data.horseParams, 'rgba(52, 152, 219, 0.4)', '#2980b9');
                drawRadarChart(`jockeyChart-${data.index}`, '騎手の特性', ['腕力', 'ペース', '馬場読', '位置取', '仕掛所'], data.jockeyParams, 'rgba(231, 76, 60, 0.4)', '#c0392b');
            });
        }



        function drawRadarChart(canvasId, label, labels, data, bgColor, borderColor) {
            let ctx = document.getElementById(canvasId);
            if(!ctx) return;
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        backgroundColor: bgColor,
                        borderColor: borderColor,
                        pointBackgroundColor: borderColor,
                        borderWidth: 1.5,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    animation: false, 
                    scales: { 
                        r: { 
                            min: 0, max: 5, 
                            ticks: { stepSize: 1, display: false },
                            pointLabels: { font: { size: 10 } }
                        } 
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
